name: Build & Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore debug keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Build Android Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare Release Info and Artifacts
        id: release_info
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK not found at $APK_PATH"
            exit 1
          fi

          VERSION_NAME=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2 || echo "1.0.0")
          VERSION_CODE=$(grep -o 'versionCode = [0-9]*' app/build.gradle.kts | awk '{print $3}' || echo "1")
          TAG="v${VERSION_NAME}-b${{ github.run_number }}"
          TITLE="JARVIS v${VERSION_NAME} (Build #${{ github.run_number }})"
          NAMED_APK="app/build/outputs/apk/debug/JARVIS-v${VERSION_NAME}-debug.apk"

          cp "$APK_PATH" "$NAMED_APK"

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "named_apk=$NAMED_APK" >> $GITHUB_OUTPUT

      - name: Upload APK to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            ${{ steps.release_info.outputs.named_apk }}
          if-no-files-found: error

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          body: |
            ## 🤖 JARVIS Android Assistant — Automated Build

            Automated debug build generated from push to `main` branch.

            - **Version:** `${{ steps.release_info.outputs.version_name }}` (Code `${{ steps.release_info.outputs.version_code }}`)
            - **Build Run:** #${{ github.run_number }}
            - **Commit:** `${{ github.sha }}`
            - **Triggered By:** `${{ github.actor }}`

            ### 📦 Downloads
            - **`JARVIS-v${{ steps.release_info.outputs.version_name }}-debug.apk`** — Versioned installation APK.
            - **`app-debug.apk`** — Standard Gradle debug APK.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            ${{ steps.release_info.outputs.named_apk }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
